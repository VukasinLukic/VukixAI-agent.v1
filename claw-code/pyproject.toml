[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "vukixai"
version = "1.0.0"
description = "Lokalni AI agent — VukixAI"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rich",
]

[project.scripts]
vukixAI = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
